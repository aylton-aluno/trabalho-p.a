<script>
    var numero = parseInt(prompt("Digite uma posição maior que zero"), 10);

    var anterior = 0;
    var atual = 1;
    var i = 0;

    do {
        var proximo = anterior + atual;
        anterior = atual;
        atual = proximo;
        i++;
    } while (i < numero);

    document.write(anterior);
</script>
