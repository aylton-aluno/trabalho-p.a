<script>
let numeros = [];
let texto = "";

for (let i = 0; i < 10; i++) {
    numeros[i] = parseInt(prompt("Digite o " + (i + 1) + "º número inteiro:"), 10);
}

for (let i = 0; i < 10; i++) {
    texto = texto + numeros[i];
    if (i < 9) {
        texto = texto + ", ";
    }
}

alert("Números digitados: " + texto);
</script>
