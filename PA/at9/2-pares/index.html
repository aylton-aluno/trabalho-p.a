<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pares de 0 a 500 (do...while)</title>
</head>
<body>
<script>
    var contador = 0;

    do {
        document.write(contador);
        contador = contador + 2;
    } while (contador <= 500);
</script>
</body>
</html>
