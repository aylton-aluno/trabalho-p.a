<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Múltiplos de 10 de 0 a 100 (for)</title>
</head>
<body>
<script>
    for(let i = 0; i <= 100; i++){

        if(i % 10 == 0){
            document.write("multiplo de 10: " + i + "<br>");
        }
    }
</script>
</body>
</html>
