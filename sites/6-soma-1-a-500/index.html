<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soma de 1 a 500 (for)</title>
</head>
<body>
<script>
    let soma = 0;

    for (let i = 1; i <= 500; i++) {
        soma = soma + i;
    }

    document.write("A soma de 1 a 500 eh: " + soma);
</script>
</body>
</html>
