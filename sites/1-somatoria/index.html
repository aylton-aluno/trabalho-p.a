<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Somatória de 1 a 400 (do...while)</title>
</head>
<body>
<script>
    var contador = 1;
    var soma = 0;

    do {
        soma = soma + contador;
        contador++;
    } while (contador <= 400);

    document.write("Somatória = " + soma);
</script>
</body>
</html>
